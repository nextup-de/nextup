# The AI server: the brain (services/brain) and its model on a machine of their own, for stacks
# whose server has no room for an 8 GB model (README.md next to this file).
#
# Never start it by hand: stack/brain-server/brain-server.sh install writes the .env (the key, the
# address to listen on, the model) and builds the brain image from this checkout.
name: nextup-brain

# Docker keeps container logs forever by default; that fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # The only published service, and only on BRAIN_BIND: the private network's address (or the
  # loopback). The public interface never sees it. Stateless - every request brings the company's
  # routing rows and earlier items, so one brain can serve several stacks.
  brain:
    image: nextup-brain:local
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BRAIN_BIND:?}:${BRAIN_PORT:-8000}:8000"
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${BRAIN_MODEL:-mistral-nemo}
      LLM_TIMEOUT: ${BRAIN_LLM_TIMEOUT:-120}
      API_KEY: ${BRAIN_API_KEY:?}
      LOG_CONTENT: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The model the brain calls. Pulls BRAIN_MODEL once into its volume on first start (the only
  # time it reaches the internet), then runs offline. No ports; CPU unless the host has a GPU.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    # Serve, pull the model if it is missing, then load it once ("ok" is a throwaway prompt), so
    # the first person after a restart does not wait for 7 GB to reach memory.
    entrypoint: ["sh", "-c", "ollama serve & pid=$$!; sleep 3; ollama pull \"$$BRAIN_MODEL\"; ollama run \"$$BRAIN_MODEL\" ok >/dev/null 2>&1; wait $$pid"]
    environment:
      BRAIN_MODEL: ${BRAIN_MODEL:-mistral-nemo}
      # Loaded for good, not for 24 h: loading takes longer than the app waits (BRAIN_TIMEOUT_MS,
      # 30 s), so a day without ideas would cost the next person the AI. The memory is set aside
      # for the model anyway.
      OLLAMA_KEEP_ALIVE: "-1"
      # Ollama's default is 4096 tokens and it cuts longer prompts silently; 80 earlier items need more.
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  ollamadata:

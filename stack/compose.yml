# One company's NextUp stack (docs/plans/2026-09-27_platform.md, "One stack").
#
# Never run this file by hand with a bare `docker compose up`: stack/install.sh writes the
# instance's .env (secrets, slug, origin) and stack/ctl.sh passes it in. Every instance is its own
# compose project, nextup-<slug>, so two companies on one machine share no network, volume or
# secret.
#
#   stack/install.sh --slug acme --origin http://localhost:8080 --stage demo --build
#   stack/ctl.sh acme ps | logs -f app | down
#
# Images: nextup-app, nextup-migrate and nextup-brain are built from this repo with --build (the
# :local tags) or come from GHCR (NEXTUP_*_IMAGE, install.sh --images). Every other image is pinned
# by version and digest below.

name: nextup-${COMPANY_SLUG:?set COMPANY_SLUG - run stack/install.sh}

# Docker keeps container logs forever by default; on a shared box that fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  db:
    <<: *hardening
    # PostgreSQL 17.11. To move: new version and its multi-arch index digest, in one PR.
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_USER: nextup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: nextup
    # Sized for one company of up to 2,000 people on a 4 vCPU / 16 GB VM (docs/ops/SIZING.md, TST/D11).
    command:
      - postgres
      # Page cache Postgres manages itself: about 25 % of the 16 GB.
      - -c
      - shared_buffers=4GB
      # The planner's guess at all cache incl. the OS file cache; it allocates nothing.
      - -c
      - effective_cache_size=10GB
      # Per sort/hash node and connection: 16 MB times the busy connections stays well under 1 GB.
      - -c
      - work_mem=16MB
      # Index builds, VACUUM and the backup restore-test run one at a time and may take more.
      - -c
      - maintenance_work_mem=512MB
      # App pool (DATABASE_POOL_MAX, default 10) + migrate + backup + 10, with room for a second app instance.
      - -c
      - max_connections=100
      # The data sits on SSD: random reads cost almost what sequential ones do, so prefer index scans.
      - -c
      - random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports: only this stack's app and migrate reach it, by service name.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextup -d nextup"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: schema first, then the company - a demo stage gets the demo company and its people,
  # a real stage only an empty company row, created once (prisma/bootstrap-company.ts). `app` waits
  # for this to finish, so code can never start ahead of its schema.
  migrate:
    image: ${NEXTUP_MIGRATE_IMAGE:-nextup-migrate:local}
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *logging
    command:
      - sh
      - -c
      - npx prisma migrate deploy && if [ "$$SEED_DEMO" = "true" ]; then npx tsx prisma/seed.ts; else npx tsx prisma/bootstrap-company.ts; fi
    environment:
      DATABASE_URL: postgresql://nextup:${POSTGRES_PASSWORD}@db:5432/nextup
      SEED_DEMO: ${SEED_DEMO:-false}
      # The seed labels a non-acme demo stack with these; a real stack's company is created from them.
      COMPANY_SLUG: ${COMPANY_SLUG}
      COMPANY_NAME: ${COMPANY_NAME:-}
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *hardening
    image: ${NEXTUP_APP_IMAGE:-nextup-app:local}
    # Nothing in the image may change at runtime. Next only writes its cache, which lives in memory.
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/app/.next/cache:uid=1001,gid=1001
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgresql://nextup:${POSTGRES_PASSWORD}@db:5432/nextup
      AUTH_SECRET: ${AUTH_SECRET:?}
      ADMIN_ACCESS_CODE: ${ADMIN_ACCESS_CODE:?}
      TENANT_MODE: single
      COMPANY_SLUG: ${COMPANY_SLUG}
      APP_ORIGIN: ${APP_ORIGIN:?}
      LANDING_URL: ${LANDING_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_DEMO_FILL: ${LOGIN_DEMO_FILL:-false}
      SMTP_URL: ${SMTP_URL:-}
      # Bug reports go to admin.sellux.ch and replies come back (docs/plans/2026-09-27_platform.md, "Tickets").
      # Unset = reports stay in this stack. The token is issued in admin.sellux.ch -> Stacks.
      OPS_URL: ${OPS_URL:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # "Continue with Microsoft" (docs/plans/2026-10-22_sso-and-data-access.md, phase 1). Unset = the
      # button stays hidden. The company's tenant is set in /admin; install.sh --entra-client-id sets both.
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      # Seals people's Microsoft 365 connections (phase 2, features/connectors/vault.ts). install.sh
      # writes it once; a new key makes every stored connection unreadable. Unset = nobody can connect.
      CONNECTOR_VAULT_KEY: ${CONNECTOR_VAULT_KEY:-}
      # The raise-page assistant (docs/ASSISTANT.md). Unset = answers from lookups, no model.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_REGION: ${LLM_REGION:-eu-central-1}
      LLM_MODEL: ${LLM_MODEL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # The brain (services/brain): proposes the routing row and spots repeats. Unset = the
      # keyword router alone. install.sh --brain sets both.
      BRAIN_URL: ${BRAIN_URL:-}
      BRAIN_API_KEY: ${BRAIN_API_KEY:-}
      # How long the app waits for an answer before the keyword router and offline coach step in.
      # Empty = the app's default (30 s). A brain on CPUs alone may need more (README there).
      BRAIN_TIMEOUT_MS: ${BRAIN_TIMEOUT_MS:-}
      # PostHog Cloud EU project key for user tests (features/testing/analytics.ts). Only a demo-stage
      # company is ever recorded, and only with ?tester=P01 in the URL. Unset = nothing is loaded.
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      # Server break-glass window and the JSON log export (SEC D5); the folders come from install.sh.
      BREAK_GLASS_DIR: /run/nextup/break-glass
      LOG_EXPORT_DIR: /var/log/nextup
      # When the last backup finished (stack/backup.sh writes last.json; read-only here).
      BACKUP_STATUS_DIR: /run/nextup/backup-status
      # The vault key being retired during a rotation (D8). Empty = no rotation under way.
      CONNECTOR_VAULT_KEY_PREVIOUS: ${CONNECTOR_VAULT_KEY_PREVIOUS:-}
    volumes:
      - ${INSTANCE_DIR:?}/break-glass:/run/nextup/break-glass:ro
      - ${INSTANCE_DIR:?}/backup-status:/run/nextup/backup-status:ro
      - ${INSTANCE_DIR:?}/logs:/var/log/nextup
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # The only thing that listens outside the stack. SITE_ADDRESS decides TLS: ":80" is plain http
  # (laptop), a bare host name gets a Let's Encrypt certificate (public server).
  caddy:
    <<: *hardening
    # Caddy 2.11.7. To move: new version and its multi-arch index digest, in one PR.
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
      # "public" lets POST /webhook/<name> through to n8n, for Jira (caddy/Caddyfile says which).
      N8N_WEBHOOKS: ${N8N_WEBHOOKS:-off}
    depends_on:
      app:
        condition: service_healthy

  # Demo stage only (COMPOSE_PROFILES=demo): catches every mail so nothing leaves the stack.
  # Inbox on the loopback of the machine running the stack.
  mailpit:
    <<: *hardening
    # Mailpit v1.33.0. To move: new version and its multi-arch index digest, in one PR.
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    profiles: [demo]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    volumes:
      - maildata:/data
    environment:
      MP_DATABASE: /data/mailpit.db

  # Optional (COMPOSE_PROFILES=...,n8n). Editor on the loopback only - reach it over the VPN or an
  # SSH tunnel, never through Caddy. Its key encrypts stored credentials: keep it with the backups.
  # Only its production webhooks can go through Caddy, and only with N8N_WEBHOOKS=public.
  n8n:
    <<: *hardening
    # n8n 2.45.7. To move: new version and its multi-arch index digest, in one PR.
    image: n8nio/n8n:2.45.7@sha256:9a8d8dcea75667496695d7810d7e1fe018a65efb36cc499d347f3931b3957b5d
    profiles: [n8n]
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-Europe/Zurich}
      # Workflows call the app inside the stack; the events API authenticates by bearer token.
      NEXTUP_APP_URL: http://app:3000
      # The address the editor shows for a Webhook node: the one Jira calls, through Caddy.
      WEBHOOK_URL: ${APP_ORIGIN:?}/
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      app:
        condition: service_healthy

  # Optional (COMPOSE_PROFILES=...,brain; install.sh --brain). No ports: only this stack's app
  # reaches it, by service name, with BRAIN_API_KEY. Stateless - the app sends the company's
  # routing rows and earlier items with every request (services/brain/README.md).
  brain:
    <<: *hardening
    image: ${NEXTUP_BRAIN_IMAGE:-nextup-brain:local}
    profiles: [brain, brain-cloud]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    environment:
      LLM_BASE_URL: ${BRAIN_LLM_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${BRAIN_MODEL:-mistral-nemo}
      LLM_TIMEOUT: ${BRAIN_LLM_TIMEOUT:-120}
      API_KEY: ${BRAIN_API_KEY:-}
      # --brain-cloud: no model server, the AI provider is called with the same AWS values as the app.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      LOG_CONTENT: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The model the brain calls. Pulls BRAIN_MODEL once into its volume on first start (the only
  # time it reaches the internet), then runs offline. No ports; CPU unless the host has a GPU.
  # Point BRAIN_LLM_URL at a vLLM/Ollama elsewhere and leave this profile's ollama idle.
  ollama:
    <<: *hardening
    # Ollama 0.40.13. To move: new version and its multi-arch index digest, in one PR.
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    profiles: [brain]
    # Serve, pull the model if it is missing, then load it once ("ok" is a throwaway prompt), so
    # the first person after a restart does not wait for 7 GB to reach memory.
    entrypoint: ["sh", "-c", "ollama serve & pid=$$!; sleep 3; ollama pull \"$$BRAIN_MODEL\"; ollama run \"$$BRAIN_MODEL\" ok >/dev/null 2>&1; wait $$pid"]
    environment:
      BRAIN_MODEL: ${BRAIN_MODEL:-mistral-nemo}
      # Loaded for good, not for 24 h: loading takes longer than the app waits (BRAIN_TIMEOUT_MS,
      # 30 s), so a day without ideas would cost the next person the AI. The memory is set aside
      # for the model anyway.
      OLLAMA_KEEP_ALIVE: "-1"
      # Ollama's default is 4096 tokens and it cuts longer prompts silently; 80 earlier items need more.
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  caddydata:
  caddyconfig:
  maildata:
  n8ndata:
  ollamadata:

# automation.sellux.ch - n8n for building and testing workflows (docs/PLATFORM_PLAN.md, step 8).
# Not a company stack: fake data only, one per box. Company stacks run their own n8n (--n8n).
#
# Never start it by hand: stack/automation/automation.sh install writes the .env (encryption key,
# login) and the nginx site. n8n and the login page only listen on the loopback.
name: nextup-automation

# Docker keeps container logs forever by default; on a shared box that fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.41.3}
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${N8N_PORT:?}:5678"
    environment:
      # Encrypts every credential stored in n8n. Lose it and the credentials are gone: it's in
      # the .env and in every backup of it - keep a copy in the password manager.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_HOST: ${N8N_HOST:?}
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      WEBHOOK_URL: https://${N8N_HOST}/
      # nginx is the one hop in front; n8n then sees the client IP and https.
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: ${TZ:-Europe/Zurich}
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      - n8ndata:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The login page in front of n8n (gate/server.mjs, no dependencies). nginx asks it about every
  # request (auth_request); n8n itself is only reachable once it says yes.
  gate:
    image: node:22-alpine
    restart: unless-stopped
    logging: *logging
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command: ["node", "/gate/server.mjs"]
    volumes:
      - ./gate:/gate:ro
    ports:
      - "127.0.0.1:${GATE_PORT:?}:8080"
    environment:
      GATE_USER: ${GATE_USER:?}
      GATE_PASSWORD_HASH: ${GATE_PASSWORD_HASH:?}
      GATE_SECRET: ${GATE_SECRET:?}
      PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/_gate/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  n8ndata:

# automation (n8n) at __HOST__ - http only, until a certificate exists (certbot certonly).
# Written by stack/automation/automation.sh from stack/automation/nginx-http.conf - change it there.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    client_max_body_size 50m;

    # Asked before every request to n8n: 204 = signed in, 401 = off to the login page.
    location = /_gate/auth {
        internal;
        proxy_pass http://127.0.0.1:__GATE_PORT__/_gate/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        # n8n's production webhooks pass without the login (gate/server.mjs says which): the gate
        # needs the method and the path exactly as n8n will get them.
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
    }

    # The login page itself.
    location /_gate/ {
        proxy_pass http://127.0.0.1:__GATE_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # n8n's production webhooks. The gate still decides: without a login only POST
    # /webhook/<letters, digits, - and _> passes, a path that is the same raw and normalized, so it
    # always lands here. This is the editor's host: a webhook's answer may not run on it (sandbox)
    # or set a cookie, and a signed-in user's cookies never reach a workflow. ~* because n8n
    # routes /WEBHOOK/ like /webhook/.
    location ~* ^/webhook/ {
        auth_request /_gate/auth;
        error_page 401 = @login;

        proxy_pass http://127.0.0.1:__N8N_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_read_timeout 300s;
        proxy_buffering off;

        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        auth_request /_gate/auth;
        error_page 401 = @login;

        proxy_pass http://127.0.0.1:__N8N_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The editor's live updates run over a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location @login {
        return 302 /_gate/login?next=$request_uri;
    }
}

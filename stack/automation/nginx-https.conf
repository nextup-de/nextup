# automation (n8n) at __HOST__: login page on 127.0.0.1:__GATE_PORT__, n8n on 127.0.0.1:__N8N_PORT__.
# Written by stack/automation/automation.sh from stack/automation/nginx-https.conf - change it there.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __HOST__;

    ssl_certificate /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Asked before every request to n8n: 204 = signed in, 401 = off to the login page.
    location = /_gate/auth {
        internal;
        proxy_pass http://127.0.0.1:__GATE_PORT__/_gate/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The login page itself.
    location /_gate/ {
        proxy_pass http://127.0.0.1:__GATE_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_gate/auth;
        error_page 401 = @login;

        proxy_pass http://127.0.0.1:__N8N_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The editor's live updates run over a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location @login {
        return 302 /_gate/login?next=$request_uri;
    }
}

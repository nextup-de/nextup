<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextUp - app UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="kit.css">
<style>a{color:inherit}a:hover{color:var(--nh-ink-2)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="RaiseScreen.jsx"></script>
<script type="text/babel" src="InboxScreen.jsx"></script>
<script type="text/babel" src="FeedScreen.jsx"></script>
<script type="text/babel" src="SentScreen.jsx"></script>
<script type="text/babel" src="ProjectScreen.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel">
class Safe extends React.Component { state = { err: null }; static getDerivedStateFromError(err) { return { err }; }
  render() { if (!this.state.err) return this.props.children; return <div className="kit-note"><div className="nh-ui-empty-title">This screen could not load</div><div className="nh-ui-empty-sub" style={{ marginBottom: 14 }}>{String(this.state.err.message || this.state.err)}</div><button className="nh-btn nh-btn-primary nh-btn-sm" onClick={() => { localStorage.removeItem("nextup-kit-place"); location.reload(); }}>Back to login</button></div>; } }
ReactDOM.createRoot(document.getElementById("root")).render(<Safe><App /></Safe>);
</script>
</body></html>

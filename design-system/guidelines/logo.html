<!-- @dsCard group="Brand" viewport="700x300" name="Logo" subtitle="Horizontal, stacked and mark - blue, black, white, blue-white" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:#fff;padding:20px;margin:0;font-family:var(--nu-font)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.t{height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#f7f7f9}.t[data-dark]{background:#1c1c1e}.t img{max-height:56px;max-width:80%}.t img.st{max-height:84px}.n{font:500 12px var(--nh-mono);color:#6e6e73;margin-top:6px}.row{display:flex;gap:10px;margin-top:10px}.row .t{flex:1;height:70px}.row img{max-height:36px}</style></head>
<body><div class="g">
<div><div class="t"><img src="../assets/brand/nextup-horizontal-blue.png" alt=""></div><div class="n">horizontal-blue (default)</div></div>
<div><div class="t"><img src="../assets/brand/nextup-horizontal-black.png" alt=""></div><div class="n">horizontal-black</div></div>
<div><div class="t" data-dark><img src="../assets/brand/nextup-horizontal-blue-white.png" alt=""></div><div class="n">horizontal-blue-white</div></div>
<div><div class="t" data-dark><img src="../assets/brand/nextup-horizontal-white.png" alt=""></div><div class="n">horizontal-white</div></div>
</div><div class="row">
<div class="t"><img class="st" src="../assets/brand/nextup-stacked-blue.png" alt="" style="max-height:60px"></div>
<div class="t" data-dark><img src="../assets/brand/nextup-stacked-blue-white.png" alt="" style="max-height:60px"></div>
<div class="t"><img src="../assets/brand/nextup-mark-blue.png" alt=""></div>
<div class="t"><img src="../assets/brand/nextup-mark-black.png" alt=""></div>
<div class="t" data-dark><img src="../assets/brand/nextup-mark-white.png" alt=""></div>
</div></body></html>

<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows" subtitle="Cards float on soft shadows instead of borders" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:#fff;padding:20px;margin:0;font-family:var(--nu-font)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}.n{font:600 12px/1.2 var(--nu-font);color:#1c1c1e}.v{font:400 12px/1.2 var(--nh-mono);color:#6e6e73}body{background:#f5f5f7}.r{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.b{height:74px;background:#fff;border-radius:12px}</style></head>
<body><div class="r"><div class="s"><div class="b" style="box-shadow:var(--nh-card-shadow)"></div><div class="n">card</div></div><div class="s"><div class="b" style="box-shadow:var(--nh-shadow-float)"></div><div class="n">float (inbox)</div></div><div class="s"><div class="b" style="box-shadow:var(--nh-shadow-feed)"></div><div class="n">feed card</div></div><div class="s"><div class="b" style="box-shadow:var(--nh-shadow-menu)"></div><div class="n">menu / popover</div></div></div></body></html>

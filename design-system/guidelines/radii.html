<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:#fff;padding:20px;margin:0;font-family:var(--nu-font)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}.n{font:600 12px/1.2 var(--nu-font);color:#1c1c1e}.v{font:400 12px/1.2 var(--nh-mono);color:#6e6e73}.r{display:flex;gap:22px;align-items:flex-end}.b{width:80px;height:64px;background:#f2f2f7;border:1px solid #e5e5ea}</style></head>
<body><div class="r"><div class="s"><div class="b" style="border-radius:6px;"></div><div class="n">--radius-xs</div><div class="v">6px</div></div><div class="s"><div class="b" style="border-radius:8px;"></div><div class="n">--radius-sm</div><div class="v">8px</div></div><div class="s"><div class="b" style="border-radius:7px;"></div><div class="n">pill 7px</div><div class="v">7px</div></div><div class="s"><div class="b" style="border-radius:12px;"></div><div class="n">--radius-md</div><div class="v">12px</div></div><div class="s"><div class="b" style="border-radius:50%;width:64px"></div><div class="n">--radius-full</div><div class="v">50%</div></div></div></body></html>

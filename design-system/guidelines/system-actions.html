<!-- @dsCard group="Colors" viewport="700x150" name="Actions & accent" subtitle="Black is the action; blue is state - now, selected, time left" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:#fff;padding:20px;margin:0;font-family:var(--nu-font)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}.n{font:600 12px/1.2 var(--nu-font);color:#1c1c1e}.v{font:400 12px/1.2 var(--nh-mono);color:#6e6e73}</style></head>
<body><div class="sw" style="grid-template-columns:repeat(6,1fr)"><div class="s"><div class="chip" style="background:#111111"></div><div class="n">--nu-black</div><div class="v">#111111</div></div><div class="s"><div class="chip" style="background:#1c1c1e"></div><div class="n">--nu-ink</div><div class="v">#1c1c1e</div></div><div class="s"><div class="chip" style="background:#007aff"></div><div class="n">--nu-blue</div><div class="v">#007aff</div></div><div class="s"><div class="chip" style="background:#0062cc"></div><div class="n">--nu-blue-ink</div><div class="v">#0062cc</div></div><div class="s"><div class="chip" style="background:#e3eaf7"></div><div class="n">--nu-gauge-track</div><div class="v">#e3eaf7</div></div><div class="s"><div class="chip" style="background:#ff3b30"></div><div class="n">--nu-red (late)</div><div class="v">#ff3b30</div></div></div></body></html>

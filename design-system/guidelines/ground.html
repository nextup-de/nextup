<!-- @dsCard group="Brand" viewport="700x240" name="The Ground" subtitle="Blue blobs, grain and dot grid under every page" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:#fff;padding:20px;margin:0;font-family:var(--nu-font)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}.n{font:600 12px/1.2 var(--nu-font);color:#1c1c1e}.v{font:400 12px/1.2 var(--nh-mono);color:#6e6e73}body{padding:0}.st{position:relative;height:240px;overflow:hidden}.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;box-shadow:var(--nh-card-shadow);padding:18px 22px;font:600 17px var(--nu-font);letter-spacing:-0.01em;color:#1b1d22;box-shadow:var(--nu-shadow)}</style></head>
<body><div class="st"><div class="nh-ground" data-contained="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span><span class="grain"></span><span class="dots"></span></div><div class="card">White cards float on the Ground</div></div></body></html>

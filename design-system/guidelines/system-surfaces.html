<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="White cards on the blue Ground; grey panels inside" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:#fff;padding:20px;margin:0;font-family:var(--nu-font)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}.n{font:600 12px/1.2 var(--nu-font);color:#1c1c1e}.v{font:400 12px/1.2 var(--nh-mono);color:#6e6e73}</style></head>
<body><div class="sw" style="grid-template-columns:repeat(8,1fr)"><div class="s"><div class="chip" style="background:#ffffff"></div><div class="n">--nu-card</div><div class="v">#ffffff</div></div><div class="s"><div class="chip" style="background:#f7f7f9"></div><div class="n">--nu-panel</div><div class="v">#f7f7f9</div></div><div class="s"><div class="chip" style="background:#f2f2f7"></div><div class="n">--nu-fill</div><div class="v">#f2f2f7</div></div><div class="s"><div class="chip" style="background:#eceef2"></div><div class="n">--nu-fill-2</div><div class="v">#eceef2</div></div><div class="s"><div class="chip" style="background:#e5e5ea"></div><div class="n">--nu-sep</div><div class="v">#e5e5ea</div></div><div class="s"><div class="chip" style="background:#f0f0f3"></div><div class="n">--nu-divider</div><div class="v">#f0f0f3</div></div><div class="s"><div class="chip" style="background:#f9fcfc"></div><div class="n">ground</div><div class="v">#f9fcfc</div></div><div class="s"><div class="chip" style="background:#eef4fd"></div><div class="n">cover bg</div><div class="v">#eef4fd</div></div></div></body></html>

<!-- @dsCard group="Colors" viewport="700x150" name="Logo blue" subtitle="Sampled from the logo - logo only; actions are black" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:#fff;padding:20px;margin:0;font-family:var(--nu-font)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .06)}.n{font:600 12px/1.2 var(--nu-font);color:#1c1c1e}.v{font:400 12px/1.2 var(--nh-mono);color:#6e6e73}</style></head>
<body><div class="sw" style="grid-template-columns:repeat(4,1fr)"><div class="s"><div class="chip" style="background:#1286fc"></div><div class="n">--nh-brand (logo)</div><div class="v">#1286fc</div></div><div class="s"><div class="chip" style="background:#b8d9ff"></div><div class="n">--nh-brand-line (focus outline)</div><div class="v">#b8d9ff</div></div><div class="s"><div class="chip" style="background:#007aff"></div><div class="n">--nu-blue (state)</div><div class="v">#007aff</div></div><div class="s"><div class="chip" style="background:#111"></div><div class="n">--nu-black (action)</div><div class="v">#111111</div></div></div></body></html>

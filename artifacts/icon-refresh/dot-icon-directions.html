<div id="nextup-dot-directions" class="viz-carousel viz-dotted-background" aria-label="Dotted icon design options">
  <section data-variant="Balanced" aria-label="Balanced dotted icons"></section>
  <section data-variant="Bold" aria-label="Bold dotted icons" hidden></section>
  <section data-variant="Minimal" aria-label="Minimal dotted icons" hidden></section>
</div>
<style>
  #nextup-dot-directions { --nu-surface: light-dark(#ffffff, #1c1d20); --nu-ink: light-dark(#202124, #f5f5f5); --nu-subtle: light-dark(#63666d, #b6b8bf); --nu-soft: light-dark(#f0f1f4, #303238); --nu-line: light-dark(#e4e6eb, #41434a); --nu-blue: light-dark(#eaf3fb, #202a38); --nu-gold: light-dark(#bc8500, #efbf4a); --nu-ring: light-dark(#e4ab0c, #d8a92c); font-family: Arial, sans-serif; color: var(--nu-ink); }
  #nextup-dot-directions > section { min-height: 590px; padding: 22px 16px 16px; box-sizing: border-box; }
  #nextup-dot-directions [hidden] { display: none; }
  #nextup-dot-directions .nu-board { background: var(--nu-surface); border-radius: 20px; overflow: hidden; }
  #nextup-dot-directions .nu-title { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 24px 24px 12px; }
  #nextup-dot-directions h2 { font-size: 22px; font-weight: 500; margin: 0; }
  #nextup-dot-directions .nu-meta { font-size: 13px; color: var(--nu-subtle); }
  #nextup-dot-directions .nu-icons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 8px; padding: 24px; }
  #nextup-dot-directions .nu-icon-cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #nextup-dot-directions .nu-icon-cell small { font-size: 12px; color: var(--nu-subtle); }
  #nextup-dot-directions .nu-samples { display: flex; align-items: center; justify-content: center; gap: 18px; }
  #nextup-dot-directions .nu-samples span { width: 24px; height: 24px; display: grid; place-items: center; }
  #nextup-dot-directions svg { flex: none; display: block; color: var(--nu-ink); }
  #nextup-dot-directions .nu-stage { background: var(--nu-blue); padding: 26px 24px 24px; }
  #nextup-dot-directions .nu-context-title { text-align: center; font-size: 20px; font-weight: 500; margin-bottom: 20px; }
  #nextup-dot-directions .nu-composer { border: 2px solid var(--nu-ring); border-radius: 18px; background: var(--nu-surface); padding: 13px; min-height: 94px; display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 10px 22px light-dark(#31455912, #00000020); }
  #nextup-dot-directions .nu-kind { width: 32px; height: 32px; border-radius: 50%; background: var(--nu-soft); display: grid; place-items: center; flex: none; }
  #nextup-dot-directions .nu-placeholder { font-size: 15px; color: var(--nu-subtle); padding-top: 7px; flex: 1; }
  #nextup-dot-directions .nu-prepared { display: flex; align-items: center; gap: 6px; border: 1px solid var(--nu-ring); border-radius: 20px; padding: 5px 9px; font-size: 12px; color: var(--nu-gold); white-space: nowrap; }
  #nextup-dot-directions .nu-prepared svg { color: inherit; }
  #nextup-dot-directions .nu-actions { display: flex; align-items: center; gap: 10px; flex: none; }
  #nextup-dot-directions .nu-send { width: 32px; height: 32px; display: grid; place-items: center; background: var(--nu-ink); border-radius: 50%; }
  #nextup-dot-directions .nu-send svg { color: var(--nu-surface); }
  #nextup-dot-directions .nu-foot { padding: 14px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--nu-subtle); }
  #nextup-dot-directions .nu-toolbar { display: flex; gap: 20px; align-items: center; }
  @media (max-width: 500px) {
    #nextup-dot-directions > section { padding: 12px 0; min-height: 720px; }
    #nextup-dot-directions .nu-title { padding: 20px 16px 8px; }
    #nextup-dot-directions .nu-icons { gap: 24px 4px; padding: 22px 12px; }
    #nextup-dot-directions .nu-stage { padding: 24px 14px 20px; }
    #nextup-dot-directions .nu-composer { flex-wrap: wrap; gap: 10px; min-height: 126px; }
    #nextup-dot-directions .nu-placeholder { flex-basis: calc(100% - 44px); }
    #nextup-dot-directions .nu-prepared { margin-left: 42px; }
    #nextup-dot-directions .nu-actions { margin-left: auto; }
    #nextup-dot-directions .nu-samples { gap: 5px; }
    #nextup-dot-directions .nu-foot { flex-wrap: wrap; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('nextup-dot-directions');
  const circle = (x,y,r,n) => Array.from({length:n}, (_,i) => [x+Math.cos(i*Math.PI*2/n)*r,y+Math.sin(i*Math.PI*2/n)*r]);
  const labels = { search:'Search', bolt:'Idea / problem', mic:'Microphone', send:'Send', plus:'Add', attachment:'Attachment', lock:'Private', chevron:'Chevron' };
  const versions = [
    { name:'Balanced', size:18, radius:1.45, meta:'18px icons · moderately spaced dots', glyphs: {
      search:[...circle(10,10,7,10),[19,19]],
      bolt:[[14,3],[10,7],[6,11],[10,11],[14,11],[10,21],[14,17],[18,13],[18,9]],
      mic:[[10,3],[14,3],[16,7],[14,11],[10,11],[8,7],[5,10],[6,14],[10,17],[14,17],[18,14],[19,10],[12,21]],
      send:[[12,3],[8,7],[4,11],[16,7],[20,11],[12,8],[12,12],[12,16],[12,21]],
      plus:[[3,12],[7.5,12],[12,12],[16.5,12],[21,12],[12,3],[12,7.5],[12,16.5],[12,21]],
      attachment:[[17,4],[12,2],[7,4],[4,8],[4,13],[4,18],[8,22],[13,22],[17,18],[17,13],[17,8],[12,7],[10,11],[10,16]],
      lock:[[5,11],[10,11],[15,11],[20,11],[20,16],[20,21],[15,21],[10,21],[5,21],[5,16],[7,7],[9,3],[14,3],[18,7]],
      chevron:[[8,4],[12,8],[16,12],[12,16],[8,20]]
    }},
    { name:'Bold', size:20, radius:1.85, meta:'20px icons · stronger, simpler silhouettes', glyphs: {
      search:[...circle(9,9,6.5,8),[18,18]],
      bolt:[[14,3],[10,7],[6,11],[12,11],[10,21],[14,17],[18,13],[17,9]],
      mic:[[9,3],[15,3],[15,8],[12,11],[9,8],[4,12],[7,17],[12,19],[17,17],[20,12],[12,23]],
      send:[[12,3],[7,8],[17,8],[12,9],[12,15],[12,21]],
      plus:[[4,12],[12,12],[20,12],[12,4],[12,20]],
      attachment:[[17,4],[11,2],[5,6],[4,12],[4,18],[9,22],[15,21],[19,16],[19,10],[14,7],[11,12],[11,17]],
      lock:[[5,11],[12,11],[19,11],[19,16],[19,21],[12,21],[5,21],[5,16],[7,6],[12,3],[17,6]],
      chevron:[[8,4],[12,8],[16,12],[12,16],[8,20]]
    }},
    { name:'Minimal', size:22, radius:2.1, meta:'22px icons · biggest dots, fewest details', glyphs: {
      search:[...circle(9,9,6.5,6),[18,18]],
      bolt:[[14,3],[10,7],[6,11],[12,11],[10,20],[15,15],[20,10]],
      mic:[[9,3],[15,3],[15,9],[9,9],[4,12],[8,18],[16,18],[20,12],[12,22]],
      send:[[12,3],[6,9],[18,9],[12,12],[12,21]],
      plus:[[4,12],[12,12],[20,12],[12,4],[12,20]],
      attachment:[[17,4],[10,2],[4,7],[4,15],[8,22],[16,21],[20,14],[17,8],[11,10],[11,16]],
      lock:[[5,11],[12,11],[19,11],[19,20],[12,20],[5,20],[7,6],[12,3],[17,6]],
      chevron:[[8,4],[12,8],[16,12],[12,16],[8,20]]
    }}
  ];
  function icon(version, name, size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${version.glyphs[name].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="${version.radius}" fill="currentColor"/>`).join('')}</svg>`;
  }
  versions.forEach(v=>{
    const stage=root.querySelector(`[data-variant="${v.name}"]`);
    stage.innerHTML=`<div class="nu-board"><div class="nu-title"><h2>${v.name}</h2><span class="nu-meta">${v.meta}</span></div><div class="nu-icons">${Object.keys(labels).map(name=>`<div class="nu-icon-cell">${icon(v,name,44)}<small>${labels[name]}</small><div class="nu-samples"><span>${icon(v,name,v.size)}</span><span>${icon(v,name,14)}</span></div></div>`).join('')}</div><div class="nu-stage"><div class="nu-context-title">Raise it, Jonas</div><div class="nu-composer"><div class="nu-kind">${icon(v,'bolt',v.size)}</div><span class="nu-placeholder">Share an idea that would make work better...</span><span class="nu-prepared">${icon(v,'plus',14)} Prepared idea</span><div class="nu-actions">${icon(v,'mic',v.size)}<span class="nu-send">${icon(v,'send',v.size)}</span></div></div><div class="nu-foot"><span>Actual UI size + 14px detail above</span><span class="nu-toolbar">${icon(v,'attachment',v.size)}${icon(v,'lock',v.size)}${icon(v,'chevron',v.size)}</span></div></div></div>`;
  });
})();
</script>

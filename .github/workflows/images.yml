# Publish the stack images to GHCR (docs/plans/2026-09-27_platform.md, stage 1 step 4).
#
# Every push to main builds that commit and pushes three images (the first two from ops/Dockerfile):
#   ghcr.io/nextup-de/nextup-app      target `run`   - what each company stack runs
#   ghcr.io/nextup-de/nextup-migrate  target `build` - the one-shot prisma migrate (+ demo seed)
#   ghcr.io/nextup-de/nextup-brain    services/brain - routing proposal and repeats (--brain stacks)
# tagged `sha-<short>` (pinned, for rollbacks). They build alongside CI (lint, typecheck, tests,
# build, both e2e suites), not after it, so a green CI finds its images ready. Nothing runs them
# until then. Only a green CI moves the tag `main` to a commit (job `ready`).
#
# The images hold this public repo's code and no secrets: .dockerignore keeps every .env out, and
# the build needs no DATABASE_URL (same condition as the CI build job). Servers pull them instead of
# getting them copied from a laptop (stack/push-images.sh, the stage-1 bridge).
#
# Then that exact tag climbs, one step at a time (stack/nginx/RUNBOOK.md, "Staging and the release
# track"):
#   staging  deploy.yml stage    -> staging.sellux.ch runs it
#   smoke    e2e:live (the interview script) against staging.sellux.ch
#   release  deploy.yml release  -> waits for Kevin's approval, then every other stack runs it
# So the box only ever runs code that passed CI, and customers only code that also ran on staging -
# a red CI on main means no deploy, and `main` stays where it is. A red commit's `sha-` images do
# exist on GHCR, and no automatic step moves them. (Until 28 Sep the deploy ran on every push, and
# a failing e2e suite still reached the box. Until 4 Nov the build waited for CI, which made a
# merge take about 17 minutes to reach staging; alongside it, about 10.)
#
# Kevin owns this file.

name: images

# A deploy run (workflow_run) is named after the commit CI tested, the one it stages and releases.
# GitHub gives it main's tip at the moment CI ended as head_sha, which a later merge may have moved:
# on 12 Nov admin's Releases page showed #736's release on #729, whose CI was red. Admin reads this
# name. Every other event keeps GitHub's own name (a whitespace-only run-name falls back to it).
run-name: ${{ github.event_name == 'workflow_run' && format('deploy {0}', github.event.workflow_run.head_sha) || ' ' }}

on:
  # The build starts with the push, so it does not wait for CI.
  push:
    branches: [main]
  # The deploy starts after CI, not after the push: only a green main is deployed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # On a PR the images are built but not pushed - proof that a change still builds a stack image.
  # A PR with the label `preview` also pushes them, and job `preview` runs them on a preview slot
  # of the box (preview.yml, RUNBOOK "PR previews"). Adding the label starts that.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths: ["apps/**", "packages/**", "ops/Dockerfile", "services/brain/**", ".dockerignore", "package.json", "package-lock.json", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and push · app + migrate + brain
    # Of the label events only `preview` builds; any other label changes nothing.
    if: >-
      github.event_name != 'workflow_run' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    # A newer PR push may cancel the older build. On main each commit has its own group: job
    # `ready` waits for every commit's images, and a shared group would drop a queued build when
    # merges land close together.
    concurrency:
      group: images-publish-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Pushed: main, and a PR from this repo with the label `preview` (a fork's token can't push).
      # A PR's sha tag never reaches a customer: deploy.sh stages and releases only main's commits.
      PUSH: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'preview') && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        shell: bash
        run: |
          short="${COMMIT::7}"
          echo "app=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextup-app" >> "$GITHUB_OUTPUT"
          echo "migrate=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextup-migrate" >> "$GITHUB_OUTPUT"
          echo "brain=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextup-brain" >> "$GITHUB_OUTPUT"
          echo "short=sha-$short" >> "$GITHUB_OUTPUT"

      # Built first: `run` copies from the `build` stage, so the second build is a cache hit.
      - name: nextup-migrate (target build)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/Dockerfile
          target: build
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.tags.outputs.migrate }}:${{ steps.tags.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.description=NextUp one-shot migrate (prisma migrate deploy + demo seed)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app image is what faces the internet, so it is scanned BEFORE it is pushed: a fixable
      # HIGH/CRITICAL finding fails the run and the image never reaches GHCR (or a server).
      - name: nextup-app (target run) - build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/Dockerfile
          target: run
          build-args: NEXTUP_COMMIT=${{ env.COMMIT }}
          load: true
          tags: nextup-app:scan
          cache-from: type=gha

      - name: Trivy - nextup-app (gate)
        # Pinned to a commit: this action's tags were once moved to malicious code (Mar 2025).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nextup-app:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: nextup-app (target run)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/Dockerfile
          target: run
          build-args: NEXTUP_COMMIT=${{ env.COMMIT }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.tags.outputs.app }}:${{ steps.tags.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.description=NextUp app, one company per stack (TENANT_MODE=single)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The migrate image runs for seconds, never listens, and carries the build toolchain (npm,
      # prisma CLI, dev dependencies) on purpose. Reported, not a gate.
      - name: Trivy - nextup-migrate (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.migrate }}:${{ steps.tags.outputs.short }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
        if: env.PUSH == 'true'

      # The brain image is built from its own folder. It listens only inside a stack, behind its API
      # key, so its scan is reported, not a gate.
      - name: nextup-brain (services/brain)
        uses: docker/build-push-action@v7
        with:
          context: services/brain
          file: services/brain/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.tags.outputs.brain }}:${{ steps.tags.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.description=NextUp brain (routing proposal, repeats)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - nextup-brain (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.brain }}:${{ steps.tags.outputs.short }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
        if: env.PUSH == 'true'

      - name: Summary
        if: env.PUSH == 'true'
        shell: bash
        run: |
          {
            echo "### Published"
            echo "- \`${{ steps.tags.outputs.app }}:${{ steps.tags.outputs.short }}\`"
            echo "- \`${{ steps.tags.outputs.migrate }}:${{ steps.tags.outputs.short }}\`"
            echo "- \`${{ steps.tags.outputs.brain }}:${{ steps.tags.outputs.short }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A PR with the label `preview`: its images, just pushed, on a preview slot of the box, and the
  # link as a comment on the PR. Closing the PR or removing the label empties the slot (preview.yml).
  preview:
    name: preview · PR stack on the box
    needs: publish
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview.yml
    with:
      action: up
      pr: ${{ github.event.pull_request.number }}
      commit: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  # CI passed on a commit of main. Its images come from that commit's push run above, usually
  # finished by now. If that build failed (the Trivy gate, say), nothing moves: re-run it, then
  # re-run this job.
  ready:
    name: green CI · images ready, move main
    # A workflow_run fires for every CI run on main, red ones too.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      packages: write
    outputs:
      commit: ${{ steps.tags.outputs.commit }}
    env:
      # The commit CI tested. On a workflow_run, github.sha is main's tip at trigger time, which a
      # later merge may already have moved.
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Wait for this commit's images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 100); do
            run="$(gh run list --workflow images.yml --event push --commit "$COMMIT" --limit 1 \
                     --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' || true)"
            case "$run" in
              "completed success") echo "images of $COMMIT are on GHCR"; exit 0 ;;
              completed*) echo "::error::the image build of $COMMIT ended: $run"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::no finished image build for $COMMIT after 25 minutes"
          exit 1

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same images under a second name: nothing is rebuilt.
      - name: Move the tag main to this commit
        id: tags
        shell: bash
        run: |
          short="${COMMIT::7}"
          for image in nextup-app nextup-migrate nextup-brain; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$image"
            docker buildx imagetools create --tag "$ref:main" "$ref:sha-$short"
          done
          echo "commit=$short" >> "$GITHUB_OUTPUT"

  # 1. staging.sellux.ch gets exactly this build.
  staging:
    name: staging
    needs: ready
    if: needs.ready.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      action: stage
      tag: ${{ needs.ready.outputs.commit }}
    secrets: inherit

  # 2. The interview script against staging, over the internet - the way people reach it.
  smoke:
    name: smoke · e2e:live on staging
    needs: [ready, staging]
    if: needs.staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The default checkout (main as this run started), not the commit the images came from: a
      # workflow_run job must not run code it took from the triggering event. It is the same commit
      # unless another merge landed in between, and then only the interview spec could be newer.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Interview script on staging
        env:
          INTERVIEW_URL: ${{ vars.STAGING_URL }}
        run: npm run e2e:live

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-staging
          path: apps/app/playwright-report/
          retention-days: 14

  # 3. Everyone else, after Kevin approves (deploy.yml, job `approve`). deploy.yml is also the
  # manual rollback (Actions -> deploy -> release, an older sha).
  release:
    name: release
    needs: [ready, smoke]
    if: needs.smoke.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      action: release
      tag: ${{ needs.ready.outputs.commit }}
    secrets: inherit

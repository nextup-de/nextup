# Publish the stack images to GHCR (docs/plans/2026-09-27_platform.md, stage 1 step 4).
#
# When CI has passed on main (lint, typecheck, tests, build, both e2e suites), this builds the very
# commit CI tested from ops/Dockerfile twice and pushes:
#   ghcr.io/selluxhenner/nextup-app      target `run`   - what each company stack runs
#   ghcr.io/selluxhenner/nextup-migrate  target `build` - the one-shot prisma migrate (+ demo seed)
# tagged `main` (moves with every merge) and `sha-<short>` (pinned, for rollbacks).
#
# The images hold this public repo's code and no secrets: .dockerignore keeps every .env out, and
# the build needs no DATABASE_URL (same condition as the CI build job). Servers pull them instead of
# getting them copied from a laptop (stack/push-images.sh, the stage-1 bridge).
#
# Then that exact tag climbs, one step at a time (stack/nginx/RUNBOOK.md, "Staging and the release
# track"):
#   staging  deploy.yml stage    -> staging.sellux.ch runs it
#   smoke    e2e:live (the interview script) against staging.sellux.ch
#   release  deploy.yml release  -> waits for Kevin's approval, then every other stack runs it
# So the box only ever runs code that passed CI, and customers only code that also ran on staging -
# a red CI on main means no new image and no deploy. (Until 28 Sep this ran on every push, and a
# failing e2e suite still reached the box.)
#
# Kevin owns this file.

name: images

on:
  # After CI, not after the push: only a green main is built and deployed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # On a PR the images are built but not pushed - proof that a change still builds a stack image.
  pull_request:
    branches: [main]
    paths: ["apps/**", "packages/**", "ops/Dockerfile", ".dockerignore", "package.json", "package-lock.json", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and push · app + migrate
    # A workflow_run fires for every CI run on main, red ones too: build only the green pushes.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # On the build only, not the whole run: a run that waits days for a release approval must
    # not hold up the next merge's build and staging. A newer PR push may cancel the older build;
    # on main never.
    concurrency:
      group: images-publish-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.tags.outputs.commit }}
      sha: ${{ steps.tags.outputs.sha }}
    env:
      # The commit CI tested. On a workflow_run, github.sha is main's tip at trigger time - which a
      # later merge may already have moved - so it is never used for what gets built.
      COMMIT: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        shell: bash
        run: |
          short="${COMMIT::7}"
          echo "commit=$short" >> "$GITHUB_OUTPUT"
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "app=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextup-app" >> "$GITHUB_OUTPUT"
          echo "migrate=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextup-migrate" >> "$GITHUB_OUTPUT"
          echo "short=sha-$short" >> "$GITHUB_OUTPUT"

      # Built first: `run` copies from the `build` stage, so the second build is a cache hit.
      - name: nextup-migrate (target build)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/Dockerfile
          target: build
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.tags.outputs.migrate }}:main
            ${{ steps.tags.outputs.migrate }}:${{ steps.tags.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.description=NextUp one-shot migrate (prisma migrate deploy + demo seed)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app image is what faces the internet, so it is scanned BEFORE it is pushed: a fixable
      # HIGH/CRITICAL finding fails the run and the image never reaches GHCR (or a server).
      - name: nextup-app (target run) - build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/Dockerfile
          target: run
          build-args: NEXTUP_COMMIT=${{ env.COMMIT }}
          load: true
          tags: nextup-app:scan
          cache-from: type=gha

      - name: Trivy - nextup-app (gate)
        # Pinned to a commit: this action's tags were once moved to malicious code (Mar 2025).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nextup-app:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: nextup-app (target run)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ops/Dockerfile
          target: run
          build-args: NEXTUP_COMMIT=${{ env.COMMIT }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.tags.outputs.app }}:main
            ${{ steps.tags.outputs.app }}:${{ steps.tags.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.description=NextUp app, one company per stack (TENANT_MODE=single)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The migrate image runs for seconds, never listens, and carries the build toolchain (npm,
      # prisma CLI, dev dependencies) on purpose. Reported, not a gate.
      - name: Trivy - nextup-migrate (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.migrate }}:${{ steps.tags.outputs.short }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
        if: github.event_name != 'pull_request'

      - name: Summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "### Published"
            echo "- \`${{ steps.tags.outputs.app }}:${{ steps.tags.outputs.short }}\` (also \`:main\`)"
            echo "- \`${{ steps.tags.outputs.migrate }}:${{ steps.tags.outputs.short }}\` (also \`:main\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # 1. staging.sellux.ch gets exactly this build.
  staging:
    name: staging
    needs: publish
    if: github.event_name == 'workflow_run' && needs.publish.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      action: stage
      tag: ${{ needs.publish.outputs.commit }}
    secrets: inherit

  # 2. The interview script against staging, over the internet - the way people reach it.
  smoke:
    name: smoke · e2e:live on staging
    needs: [publish, staging]
    if: needs.staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Interview script on staging
        env:
          INTERVIEW_URL: ${{ vars.STAGING_URL }}
        run: npm run e2e:live

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-staging
          path: apps/app/playwright-report/
          retention-days: 14

  # 3. Everyone else, after Kevin approves (deploy.yml, job `approve`). deploy.yml is also the
  # manual rollback (Actions -> deploy -> release, an older sha).
  release:
    name: release
    needs: [publish, smoke]
    if: needs.smoke.result == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      action: release
      tag: ${{ needs.publish.outputs.commit }}
    secrets: inherit

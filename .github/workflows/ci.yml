# CI for NextUp (npm workspaces: the Next.js app lives in apps/app, root scripts run it via turbo).
#
# Four jobs, all must pass before a PR can merge:
#   guard   — no secrets / forbidden files / oversized files / Kevin-owned paths
#   app     — npm ci, npm audit (prod, high+), lint, typecheck, unit tests, production build
#   e2e     — Playwright, demo mode (no database): the inbox loop, role homes,
#             escalation to the deputy, every page at phone width
#   e2e-db  — Playwright against Postgres: a company made in /admin, personal
#             login codes, the loop across real sessions, Settings -> Members
#
# The legacy demo's syntax + smoke jobs went with legacy/ in #61; e2e is their port.
#
# Kevin owns this file.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to a PR branch cancels its older run. On main every commit keeps its run: cancelling
# there left the newest commit without a green CI (#148, 5 Oct 2026), so images never started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guard:
    name: guard · secrets & forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List changed files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" > changed.txt
          else
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD > changed.txt || : > changed.txt
          fi
          echo "Changed files:"; cat changed.txt

      - name: Block forbidden files
        shell: bash
        run: |
          fail=0
          # Must never land in the repo, regardless of .gitignore.
          FORBIDDEN='(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|\.jks$|\.keystore$|(^|/)id_rsa|(^|/)id_ed25519|credentials.*\.json$|service-?account.*\.json$|firebase-adminsdk.*\.json$|(^|/)node_modules/|\.sqlite3?$|\.db$|(^|/)\.claude/settings\.local\.json$|(^|/)uploads/.*\.(png|jpe?g|gif|webp|heic|mp4|mov)$'
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ "$f" = ".env.example" ] && continue
            if echo "$f" | grep -Eiq "$FORBIDDEN"; then
              echo "::error file=$f::Forbidden file in PR: $f  (secrets, credentials, databases, dependencies and media uploads must not be committed — see CLAUDE.md)"
              fail=1
            fi
          done < changed.txt
          exit $fail

      - name: Block edits to protected config
        shell: bash
        run: |
          fail=0
          # Author check is advisory, not security — the ruleset is the real gate.
          if [ "${{ github.actor }}" != "selluxhenner" ]; then
            for p in '^\.github/' '^\.gitignore$' '^CLAUDE\.md$' '^CONTRIBUTING\.md$'; do
              if grep -Eq "$p" changed.txt; then
                echo "::error::Changes matching '$p' are owned by Kevin. Please remove them from this PR and ask."
                fail=1
              fi
            done
          fi
          exit $fail

      - name: Block oversized files (> 1 MB)
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            { [ -z "$f" ] || [ ! -f "$f" ]; } && continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 1048576 ]; then
              echo "::error file=$f::$f is $((size/1024)) KB. Files over 1 MB don't belong in git — ask Kevin where it should live."
              fail=1
            fi
          done < changed.txt
          exit $fail

      - name: No obvious API keys in source
        shell: bash
        run: |
          # Belt-and-braces on top of gitleaks: common key prefixes in tracked text files.
          if grep -rnE '(sk-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35})' \
               --include='*.js' --include='*.ts' --include='*.tsx' --include='*.html' --include='*.css' --include='*.md' --include='*.json' --include='*.yml' . \
               --exclude-dir=.git --exclude-dir=node_modules; then
            echo "::error::Something that looks like an API key is in the source. Remove it and rotate the key."
            exit 1
          fi
          echo "ok"

      # The open-source gitleaks scanner (MIT) itself. Its GitHub Action wants a paid licence for
      # organization repos since the move to nextup-de; the scanner needs none. A pinned version,
      # checked against the release's own checksum list.
      - name: Secret scan (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          # The commits this run brings in, as the action scanned them: a PR's own, or a push's.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "$url/$tgz"
          curl -fsSL -o "$RUNNER_TEMP/sums.txt" "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tgz\$" sums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          range=HEAD
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .

  app:
    name: app · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Known vulnerabilities in what ships to production (dependencies, not devDependencies).
      # High and critical fail the PR; lower ones are Dependabot's job.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e · Playwright, demo mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app, starts it on :3100 with DATABASE_URL="" and runs
      # tests/e2e/demo. CI=true turns on forbidOnly and one retry.
      - name: Run the demo suite
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-demo
          path: apps/app/playwright-report/
          retention-days: 14

  e2e-db:
    name: e2e-db · Playwright against Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nextup
          POSTGRES_PASSWORD: nextup
          POSTGRES_DB: nextup_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nextup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # A database that lives for this one job; the password is the service's own, not a secret.
    env:
      DATABASE_URL: postgresql://nextup:nextup@127.0.0.1:5432/nextup_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Fresh random values every run, masked in the log - nothing to store in repo secrets.
      - name: Generate AUTH_SECRET and ADMIN_ACCESS_CODE
        shell: bash
        run: |
          auth=$(openssl rand -hex 32); admin=$(openssl rand -hex 16)
          echo "::add-mask::$auth"; echo "::add-mask::$admin"
          echo "AUTH_SECRET=$auth" >> "$GITHUB_ENV"
          echo "ADMIN_ACCESS_CODE=$admin" >> "$GITHUB_ENV"

      - name: Migrate the empty database
        run: npm run db:migrate

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Creates its own company in /admin, logs in with the codes it prints, deletes it afterwards.
      - name: Run the database suite
        run: npm run e2e:db

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-db
          path: apps/app/playwright-report/
          retention-days: 14
